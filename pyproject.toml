[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douban-top250-analytics"
version = "1.0.0"
description = "Reproducible analysis and interactive visualization for the Douban Movie Top250 list"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "pandas>=2.0,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
douban-scrape = "douban_top250.scraper:main"
douban-dashboard = "douban_top250.dashboard:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

